name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The box's checks run with HOME=/home/builder, the box user's home in container/Dockerfile.box.
      - run: sudo install -d -o "$(id -u)" -g "$(id -g)" /home/builder
      - run: npm run check
      - run: npm test
